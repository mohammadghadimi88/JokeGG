<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEST | کمدی و درآمدزایی</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --border: #334155;
            --accent: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo { font-weight: 900; font-size: 1.4rem; color: var(--primary); }

        .wallet-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--accent);
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        .main-content {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* کارت ارسال جوک */
        .post-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        textarea {
            width: 100%;
            height: 70px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 8px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        /* کارت‌های Feed */
        .joke-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        .joke-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .joke-text {
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }

        /* مودال ورود */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border);
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">JEST 😂</div>
        <div id="userInfo" style="display: flex; gap: 8px; align-items: center;">
            <div class="wallet-badge" id="walletDisplay">موجودی: $0.00</div>
            <button id="authBtn" class="btn" onclick="openAuth()">ورود</button>
        </div>
    </header>

    <div class="main-content">
        <!-- فرم انتشار جوک -->
        <div class="post-box">
            <textarea id="jokeInput" placeholder="یک جوک خنده‌دار بنویس... (هزینه انتشار: $1)"></textarea>
            <div class="post-actions">
                <span style="font-size: 0.8rem; color: #94a3b8;">سهم شما از فروش: ۵۰٪</span>
                <button class="btn" onclick="publishJoke()">انتشار ($1)</button>
            </div>
        </div>

        <!-- فید جوک‌ها -->
        <div id="jokeFeed" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- جوک‌ها به‌صورت خودکار از سوپابیس اینجا بارگذاری می‌شوند -->
        </div>
    </div>
</div>

<!-- مودال احراز هویت -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <h3 style="margin: 0; text-align: center;">ورود به JEST</h3>
        <input type="email" id="email" placeholder="ایمیل">
        <input type="password" id="password" placeholder="رمز عبور">
        <button class="btn" onclick="handleAuth('login')">ورود به حساب</button>
        <button class="btn" style="background:#334155; color: #fff;" onclick="handleAuth('signup')">ثبت‌نام جدید ($10)</button>
        <button class="btn" style="background:transparent; color:#ef4444;" onclick="closeAuth()">انصراف</button>
    </div>
</div>

<script>
    // تنظیمات دیتابیس سوپابیس
    const SUPABASE_URL = 'https://ajddkfdfpmiwwjsoyluh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // کلید anon شما
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // توابع مودال
    function openAuth() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuth() { document.getElementById('authModal').style.display = 'none'; }

    // احراز هویت
    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) return alert('لطفاً ایمیل و رمز عبور را وارد کنید.');

        let res = type === 'signup' 
            ? await supabase.auth.signUp({ email, password })
            : await supabase.auth.signInWithPassword({ email, password });

        if(res.error) {
            alert('خطا: ' + res.error.message);
        } else {
            currentUser = res.data.user;
            alert('با موفقیت وارد شدید!');
            closeAuth();
            document.getElementById('authBtn').innerText = 'پروفایل';
            loadJokes();
        }
    }

    // انتشار جوک
    async function publishJoke() {
        const text = document.getElementById('jokeInput').value;
        if(!text) return alert('متن جوک را بنویسید.');
        if(!currentUser) return openAuth();

        const { data, error } = await supabase
            .from('jokes')
            .insert([{ content: text, user_id: currentUser.id }]);

        if(error) {
            alert('خطا در ثبت: ' + error.message);
        } else {
            alert('جوک شما با موفقیت منتشر شد!');
            document.getElementById('jokeInput').value = '';
            loadJokes();
        }
    }

    // دریافت لیست جوک‌ها
    async function loadJokes() {
        const { data: jokes, error } = await supabase
            .from('jokes')
            .select('*')
            .order('created_at', { ascending: false });

        const feed = document.getElementById('jokeFeed');
        if(jokes && jokes.length > 0) {
            feed.innerHTML = jokes.map(j => `
                <div class="joke-card">
                    <div class="joke-header">
                        <span>کاربر JEST</span>
                        <span>۲ دقیقه پیش</span>
                    </div>
                    <p class="joke-text">${j.content}</p>
                </div>
            `).join('');
        } else {
            feed.innerHTML = '<div class="joke-card"><p class="joke-text">هنوز جوکی ثبت نشده است. اولین نفر باشید!</p></div>';
        }
    }

    // بارگذاری اولیه
    loadJokes();
</script>

</body>
</html>
